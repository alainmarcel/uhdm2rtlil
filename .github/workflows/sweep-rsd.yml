# RSD (rsd-devel/rsd): the out-of-order superscalar RV32 core sv-tests builds
# as top `Core` -- 171 synthesizable modules across its fetch / rename /
# scheduler / exec / LSU / cache blocks.  A CORE sweep with its own action
# (like veer-eh1, scr1, ibex and rp32), not an external-IP family: it is one
# core closure, and the cores chipsalliance/sv-tests covers get an individual
# sweep each.
#
# The sources are a shallow clone pinned by test/ext_ip/rsd.json.  RSD's
# microarchitecture configuration is NOT passed as -D: it is compiled as a
# source (test/ext_ip/stubs/rsd_config.sv, a "harness_srcs" entry) so that the
# Verilator RTL reference is built with the same configuration as the two
# netlists -- netlist_cosim.py hardcodes -DSYNTHESIS and takes no other
# defines, so a -D-shaped configuration makes BOTH netlists diverge from the
# RTL and the co-sim column says nothing.
name: Sweep rsd

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: "Co-sim cycles per module"
        required: false
        default: "300"
  schedule:
    - cron: "33 4 * * *"   # nightly 04:33 UTC, after veer-eh1's 03:33

concurrency:
  group: sweep-rsd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    uses: ./.github/workflows/core-sweep.yml
    with:
      core: rsd
      cycles: ${{ github.event.inputs.cycles || '300' }}
      timeout: 300
      # 171 rows, and `Core` is the whole out-of-order core (a 100-file
      # closure): shard it rather than widening the per-shard concurrency, so
      # no runner ever holds two 12 GB miters at once.  Same split caliptra,
      # cva6 and veer-eh1 use.
      shards: 8
      jobs: "1"
      # DO NOT RAISE mem_limit_kb ON THIS CORE.  It was set to 14500000 and
      # that LOST EVERY SHARD, twice: with 14.5 GB of address space allowed,
      # Surelog stops failing its 1.65 GB UHDM serialisation gracefully and
      # instead grows into real memory until the kernel takes the runner
      # agent down -- "The runner has received a shutdown signal", exit 143,
      # every shard ~15 min in, no rows at all (runs 38125027389 and
      # 38133880734).  At the 12 GB default the same rows fail ONE AT A TIME
      # (capnproto `calloc(...): Cannot allocate memory`) and the shard keeps
      # going, so the other 48 rows still get measured (run 38108782534).
      # Other cores' sweeps ran fine at 12 GB in the same window, so this is
      # the cap, not the infrastructure.
      #
      # The underlying problem is RSD's footprint, not the budget: every
      # module with an interface port pulls the whole-core closure (143
      # files, ~1 MB of source) which its parameterisation explodes into a
      # 1.65 GB UHDM database, peaking at 12.2 GB of VSZ (measured VmPeak
      # 12473 MB) against the 11.7 GB the default allows.  Fixing those rows
      # needs a smaller closure or a smaller UHDM, not more address space on
      # a 16 GB runner.  ext_flow now at least reports them honestly, as
      # `elab-fail` quoting Surelog's own abort, instead of blaming
      # read_uhdm.
      mem_limit_kb: "12000000"
