# Syntacore SCR1 (syntacore/scr1): RV32IMC core, its pipeline and the AXI/AHB
# SoC tops -- 37 synthesizable modules.  A CORE sweep with its own action
# (like ibex and rp32), not an external-IP family: it is one core closure, the
# cores chipsalliance/sv-tests covers get an individual sweep each, and SCR1 is
# the first of them.  The sources are a shallow clone pinned by
# test/ext_ip/scr1.json (the commit sv-tests pins), which core_sweep.py fetches.
name: Sweep scr1

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: "Co-sim cycles per module"
        required: false
        default: "300"
  schedule:
    - cron: "33 2 * * *"   # nightly 02:33 UTC

concurrency:
  group: sweep-scr1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    uses: ./.github/workflows/core-sweep.yml
    with:
      core: scr1
      cycles: ${{ github.event.inputs.cycles || '300' }}
      timeout: 180
      # Serialise the miters.  The two SoC tops (scr1_top_ahb / scr1_top_axi)
      # became WHOLE-CHIP proofs once #1059 stopped their dynamic writes from
      # being dropped -- before that they died early in opt_muxtree and never
      # reached SAT.  Each peaks around 61 GB unbudgeted; with the 12 GB
      # `ulimit -v` one is capped safely and reports `SAT over memory cap`, but
      # TWO at a time want 24 GB of address space on a 16 GB runner and the
      # runner is reclaimed mid-sweep (exit 143, "runner has received a
      # shutdown signal") -- the same failure caliptra hit and solved by
      # sharding.
      jobs: "1"
