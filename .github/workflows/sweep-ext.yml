name: Sweep external IP

# Per-module report for the external IP families under test/ext_ip/ (PULP
# common_cells / AXI, OpenHW CVE2 / CORE-V Wally, XiangShan's SystemVerilog
# arithmetic library, Alex Forencich's
# verilog-ethernet / verilog-pcie, hdl-util hdmi, the Caliptra subsystem
# caliptra-ss ...): every module of a
# family is read by read_uhdm and read_slang from a shallow clone at the
# manifest's pinned commit, SAT-mitered from reset, opt-checked and Verilator
# co-simulated against the RTL (test/ext_ip/ext_flow.py via core_sweep.py).
# Nightly + manual dispatch; one reusable sweep job per family.
#
# The XiangShan CORE is a core, not an external component library: it has its
# own nightly (sweep-xiangshan.yml, family xiangshan-core-full, 16 shards).
# The `xiangshan` family here is the project's hand-written XS-Verilog-Library.

on:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * *"   # nightly 03:47 UTC, clear of the pavona / caliptra sweeps

concurrency:
  group: sweep-ext-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: common_cells
          - family: axi
          - family: cve2
          - family: cv32e40p
          - family: cvfpu
          # cvw's fdivsqrtuslc4 is 113 lines that declare a 1024-entry unpacked
          # array and fill it from a nested loop inside always_comb.  Unrolled,
          # read_uhdm peaks at 10.5 GB on it.  The sweep runs --jobs 2, so at
          # the default 12 GB cap two concurrent modules exhaust a 16 GB runner
          # BEFORE either trips its own ulimit, and the runner is killed --
          # "The runner has received a shutdown signal ... exit code 143",
          # which had this workflow red every night.  Capped so that jobs x cap
          # fits, the heavy module fails its own row with a bad_alloc and the
          # other 233 still report.
          - family: cvw
            mem_limit_kb: "7000000"
          # Both of these grew a lot of work on 2026-09-30: raising slang's
          # unroll limit and binding the segment counts turned rows that used
          # to fail in a second into rows that elaborate, miter and
          # co-simulate, and the single shard was killed at 47 minutes ("exit
          # code 143" -- the runner, not the row).  Same treatment as cvw and
          # caliptra-ss: split the work and cap each process so `jobs x cap`
          # fits a 16 GB runner.
          - family: verilog-ethernet
            shards: 2
            mem_limit_kb: "7000000"
          - family: verilog-pcie
            shards: 2
            mem_limit_kb: "7000000"
          - family: hdmi
          - family: xiangshan
          # Caliptra subsystem (chipsalliance/caliptra-ss @ dfa6c631, with its
          # caliptra-rtl / i3c-core / usb2 / adams-bridge submodules): the
          # subsystem's OWN modules (src/, i3c-core, usb2 -- `sweep_paths`),
          # the vendored caliptra-rtl serving the closures only (it is the
          # caliptra chip sweep).  ~280 modules, some with 13 MB Surelog
          # closures (the MCU / subsystem tops), sharded 3 ways under the
          # same 7 GB x 2-job cap as cvw.  The MCU top needs Surelog's
          # struct-member size-cast fix to elaborate (see the manifest).
          - family: caliptra-ss
            shards: 3
            timeout: 330
            mem_limit_kb: "7000000"
          # UPSTREAM lowRISC OpenTitan's IP library (lowRISC/opentitan @
          # f49474bc, the commit the caliptra-ss family above already fetches).
          # test/opentitan_equiv sweeps ONE of its 45 blocks (OTBN) from a
          # vendored copy; this is the rest of the library -- 611 modules across
          # hw/ip, hw/ip_templates and top_earlgrey's generated IP.  Pavona is a
          # hard FORK whose RTL has diverged, so a pavona verdict is not an
          # upstream one even for a block both trees have.
          #
          # Sharded 8 ways under the same 7 GB x 2-job cap as cvw and
          # caliptra-ss: the big blocks are slow rather than huge (otp_ctrl 448
          # s, spi_device 251 s, usbdev 202 s measured locally), so the budget
          # is wall clock, not memory.
          - family: opentitan-ip
            shards: 8
            timeout: 330
            mem_limit_kb: "7000000"
          # chipsalliance/adams-bridge @ c4a921cf (the commit caliptra-rtl
          # vendors): the ML-DSA accelerator's own 117 modules -- NTT, samplers,
          # encoders / decoders, SHA3, the control block and abr_top.  The
          # caliptra sweep measures only its instances inside caliptra_top.
          # Two shards: ~4000 s of row time measured locally, the tops and the
          # NTT butterflies run their SAT budget out.
          - family: adams-bridge
            shards: 2
            timeout: 330
          # chipsalliance/aib-protocols @ 9e308bfb: the AIB die-to-die protocol
          # layers (logic link, AXI4-MM / AXI4-Stream configurations, LPIF,
          # SPI-AIB, channel alignment), 397 modules.  Two shards: ~6000 s of
          # row time measured locally, the largest row 683 s.
          - family: aib-protocols
            shards: 2
            timeout: 330
          # chipsalliance/aib-phy-hardware @ a0295cd2: the AIB 2.0 rev1.1 PHY's
          # digital RTL (adapter, Avalon config, calibration FSMs, redundancy,
          # aib_phy_top), 75 rows over the analog behavioural models as
          # closure-only sources; aib_phy_top alone takes ~16 min.
          - family: aib-phy-hardware
            timeout: 330
          # chipsalliance/VeeRwolf @ 9a919805 (v0.7.5): the reference SoC around
          # VeeR EL2, closed through its own FuseSoC build (the manifest's
          # generate step runs test/ext_ip/veerwolf_setup.sh: pip fusesoc, apt
          # libbit-vector-perl, fusesoc-cores @ def274ab).  26 rows; the SoC
          # top's closure carries the whole EL2 core.
          - family: veerwolf
            timeout: 330
          # olofk/serv @ f200eb2e: the bit-serial RISC-V core, the servant SoC and
          # its peripherals; the board tops that instantiate vendor PLL / IO
          # primitives are excluded in the manifest.  29 rows, ~2 min of row time.
          - family: serv
          # enjoy-digital/litex @ 7457e137 (release 2026.08): the litex_sim SoC
          # around VexRiscv, emitted by Migen; the manifest's generate step runs
          # litex_setup.py (clones + installs the LiteX ecosystem at the release
          # tag, ~1 GB) and litex_sim --no-compile.  4 rows, ~9 min of row time.
          - family: litex
            timeout: 600
          # SpinalHDL/VexRiscv @ baf7dc82: the GenFull core and its two caches,
          # generated by sbt (test/ext_ip/vexriscv_setup.sh installs sbt and
          # downloads SpinalHDL on the first run).  3 rows, ~6 min of row time.
          - family: vexriscv
            timeout: 600
          # SpinalHDL/NaxRiscv @ 9f452d50: the out-of-order superscalar RV32
          # core and its 23 submodules (data cache, issue queue, multi-write
          # register-file RAMs, radix-4 divider, MMU translator), generated by
          # test/ext_ip/naxriscv_setup.sh -- which builds SpinalHDL from source
          # (build.sbt reaches it through ProjectRef), so the first run compiles
          # the Scala toolchain as well.  24 rows.
          - family: naxriscv
            timeout: 900
          # openhwfoundation/cv32e40x @ d952cd63: the CORE-V CV32E40X -- the
          # 4-stage RV32 core with B / M (and optional A), CLIC interrupts,
          # PMA / MPU, watchpoint triggers and the CORE-V eXtension interface.
          # Its own cv32e40x_manifest.flist is the closure.  42 rows.
          - family: cv32e40x
            timeout: 330
          # openhwfoundation/cv32e40s @ 9d9cae78: the SECURITY variant of the
          # same 4-stage RV32 core -- PMP / Smepmp, hardened CSRs with shadow
          # copies, dummy-instruction and PC hardening, integrity-checked OBI.
          # Needs three bhv files as sources, not one: cv32e40s_csr
          # instantiates cv32e40s_sffs / sffr and only bhv defines them.
          # 48 rows.
          - family: cv32e40s
            timeout: 330
          # openhwfoundation/core-v-mcu @ 61fe7db2: the OpenHW microcontroller
          # around CV32E40P -- APB peripherals, the uDMA subsystem, the L2 /
          # TCDM interconnect and the FC glue, over the PULP libraries it
          # vendors.  Everything is flattened into rtl/ (no FuseSoC step).
          # ~380 rows: two shards.
          - family: core-v-mcu
            shards: 2
            timeout: 330
            mem_limit_kb: "7000000"
          # pulp-platform/register_interface @ d6e1d4cd: the reg_bus protocol
          # and its bridges.  EVERY row needs the manifest's `bind` section --
          # unbound, all 19 take their bus as `parameter type req_t = logic`
          # and the family measures nothing.  19 rows.
          - family: register_interface
            timeout: 330
          # pulp-platform/tech_cells_generic @ 55cb5451: the behavioural
          # technology cells every other PULP family carries as closure-only
          # roots -- clock gating / muxing, SRAM, power management, and the
          # deprecated pulp_clock_* / pad / memory cells.  src/fpga is excluded
          # (duplicate module names + an undefined Xilinx BUFGMUX).  53 rows.
          - family: tech_cells_generic
            timeout: 330
          # XUANTIE-RV/opene906 @ c5b87895: T-Head's XuanTie E906, the 32-bit
          # RV32 embedded core -- ifu / idu / iu / lsu / rtu / cp0, the FPU and
          # its falu / fdsu / fmau datapaths, the CLIC / CLINT, PMP / PMU, the
          # bus interface, the debug transport (tdt) and trace (dtu) blocks,
          # plus the smart_run platform around it.  Like OpenC910 it reads
          # --single-unit over define-only headers.  255 rows: two shards.
          - family: opene906
            shards: 2
            timeout: 330
            mem_limit_kb: "7000000"
          # chipsalliance/rocket-chip @ ece7b9ad: the DefaultConfig Rocket core,
          # L1 caches, PTW, TileLink fabric, debug / PLIC / CLINT -- one
          # SystemVerilog file per module out of mill + firtool, generated by
          # test/ext_ip/rocket_setup.sh (installs mill, firtool and dtc
          # user-locally; the first run downloads the Scala toolchain).  235
          # rows, ~3.7 h of row time measured locally: four shards.
          - family: rocket-chip
            shards: 4
            timeout: 600
            mem_limit_kb: "7000000"
          # ultraembedded/biriscv @ be4b5d3b: the dual-issue RV32 core, its
          # caches and their RAMs, the TCM and the two SoC tops.  44 rows,
          # ~50 min of row time measured locally.
          - family: biriscv
            timeout: 480
          # ZipCPU (dgisselq/zipcpu @ 7f1f0b4a): the CPU core, its caches, the
          # Wishbone / AXI peripherals and the four SoC tops.  51 rows, ~40 min
          # of row time measured locally.
          - family: zipcpu
            timeout: 420
          # Wren6991/Hazard3 @ 8af99293: the RV32 core, its ALU / multipliers,
          # the AHB / APB / AXI front-ends and the debug module.  25 rows,
          # ~15 min of row time measured locally.
          - family: hazard3
          # nvdla/hw @ 8e06b1b9: NVDLA's own RTL -- the convolution, SDP, PDP,
          # CDP and BDMA pipelines, the CSB / APB interfaces and the glue.
          # The gate / flop / RAM libraries it instantiates (vmod/vlibs,
          # vmod/rams) are always_srcs, not rows.  953 rows: eight shards.
          - family: nvdla
            shards: 8
            timeout: 330
            mem_limit_kb: "7000000"
          # XUANTIE-RV/openc910 @ b91c9093: T-Head's XuanTie C910, the 64-bit
          # out-of-order RV64GCV core -- its pipeline, vector-FP units, L2
          # cache, bus / coherency units, CLINT / PLIC / PMP / PMU and the
          # smart_run integration platform around it.  The 41 ct_f_spsram_*
          # behavioural RAMs of gen_rtl/fpga/rtl are always_srcs, not rows.
          # 482 rows: eight shards.
          - family: openc910
            shards: 8
            timeout: 480
            mem_limit_kb: "7000000"
          # riscv-boom/riscv-boom @ ba03175e: BOOM v4's LargeBoom core inside
          # rocket-chip's DefaultConfig SoC, elaborated by
          # test/ext_ip/boom_setup.sh (BOOM compiles as an extra module in the
          # rocket-chip checkout; see the manifest note for why).  422 rows,
          # ~9.6 h of row time measured locally: eight shards.
          - family: boom
            shards: 8
            timeout: 480
            mem_limit_kb: "7000000"
          # ucb-bar/gemmini @ 8c3f992: Gemmini's LeanGemmini systolic-array
          # accelerator as a RoCC on rocket-chip's DefaultConfig, elaborated by
          # test/ext_ip/gemmini_setup.sh (compiled as an extra module in the
          # rocket-chip checkout; see the manifest note for the FireSim shim,
          # the no-arg configs and the firtool annotation trap).  384 rows.
          - family: gemmini
            shards: 6
            timeout: 480
            mem_limit_kb: "7000000"
          # PrincetonUniversity/openpiton @ 1c6bfd2d: the manycore tile (its
          # OpenSPARC T1-derived core, the L1.5 / L2 caches, the dynamic-node
          # NoC routers), the chip bridge, JTAG, the chipset and the common
          # cells.  test/ext_ip/openpiton_setup.sh runs the PyHP templates
          # first; see the manifest note for the two leads it exposes.
          # 852 rows, ~3.3 h of row time measured locally.
          - family: openpiton
            shards: 4
            timeout: 420
            mem_limit_kb: "7000000"
          # pulp-platform/pulpissimo @ bfc3d9a1: the PULPissimo microcontroller
          # platform and the 26 dependency packages that are not families of
          # their own -- pulp_soc, the uDMA peripherals, the HWPE accelerator
          # blocks, the cluster interconnect, the APB peripherals, JTAG and
          # debug.  test/ext_ip/pulpissimo_setup.sh resolves the Bender closure
          # first.  327 rows, ~3.1 h of row time measured locally.
          - family: pulpissimo
            shards: 4
            timeout: 420
            mem_limit_kb: "7000000"
          # pulp-platform/cheshire @ a315a828: PULP's Linux-capable host SoC and
          # the dependency IP that is not a family of its own -- the AXI
          # last-level cache, iDMA, CLIC / CLINT, the OBI fabric, the serial
          # link, the vendored OpenTitan peripherals.  Bender closure via the
          # shared test/ext_ip/bender_setup.sh.  266 rows, ~0.8 h locally; most
          # rows skip because PULP's type parameters do not elaborate at their
          # defaults (see the manifest note).
          - family: cheshire
            timeout: 420
            mem_limit_kb: "7000000"
          # pulp-platform/snitch_cluster @ ccde489f: the Snitch integer core, its
          # FP subsystem / IPU / SSR streamer / VM, the memory interface and
          # the cluster, plus the cluster i-cache, CORE-V XIF, reqrsp
          # interface and the Spatz vector unit.  Bender closure via the
          # shared test/ext_ip/bender_setup.sh.  104 rows, ~1.3 h locally;
          # as with cheshire most rows skip at default type parameters.
          - family: snitch
            timeout: 420
            mem_limit_kb: "7000000"
          # apache/tvm-vta @ d4a15f62: Apache TVM's Versatile Tensor
          # Accelerator -- the fetch / load / compute / store pipeline, the
          # GEMM core, the tensor ALU and the VME / VCR interfaces.  Chisel
          # 3.5, so test/ext_ip/vta_setup.sh uses VTA's own `make verilog`
          # (sbt + the Scala FIRRTL compiler, no firtool).  66 rows, ~1 h.
          - family: vta
            timeout: 420
            mem_limit_kb: "7000000"
    name: ext - ${{ matrix.family }}
    uses: ./.github/workflows/core-sweep.yml
    with:
      core: ${{ matrix.family }}
      cycles: "300"
      timeout: ${{ matrix.timeout || 300 }}
      shards: ${{ matrix.shards || 1 }}
      mem_limit_kb: ${{ matrix.mem_limit_kb || '12000000' }}
