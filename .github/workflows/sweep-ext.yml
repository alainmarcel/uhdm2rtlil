name: Sweep external IP

# Per-module report for the external IP families under test/ext_ip/ (PULP
# common_cells / AXI, OpenHW CVE2 / CORE-V Wally, XiangShan's SystemVerilog
# arithmetic library, Alex Forencich's
# verilog-ethernet / verilog-pcie, hdl-util hdmi ...): every module of a
# family is read by read_uhdm and read_slang from a shallow clone at the
# manifest's pinned commit, SAT-mitered from reset, opt-checked and Verilator
# co-simulated against the RTL (test/ext_ip/ext_flow.py via core_sweep.py).
# Nightly + manual dispatch; one reusable sweep job per family.
#
# The XiangShan CORE (xiangshan-core-full) IS in the matrix: the core is
# Chisel and its generator does not fit a hosted runner (40 GB JVM heap,
# 3.2 M lines), so the family fetches the generator's output from the release
# asset xiangshan-rtl-e4566c29 (13 MB) and sweeps every generated module --
# each already carries the parameterisation it has under XSTop -- sharded 16
# ways.  Surelog on the whole XSTop wants ~36 GB, so modules whose source
# closure exceeds the manifest's 16 MB cap (the 8 top-level blocks) are
# reported as skipped; sweep those from a workstation with
# `make xiangshan-core-full-gen` (regenerates) / `make xiangshan-core`
# (MinimalConfig).  The `xiangshan` family is the hand-written
# XS-Verilog-Library.

on:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * *"   # nightly 03:47 UTC, clear of the pavona / caliptra sweeps

concurrency:
  group: sweep-ext-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: common_cells
          - family: axi
          - family: cve2
          # cvw's fdivsqrtuslc4 is 113 lines that declare a 1024-entry unpacked
          # array and fill it from a nested loop inside always_comb.  Unrolled,
          # read_uhdm peaks at 10.5 GB on it.  The sweep runs --jobs 2, so at
          # the default 12 GB cap two concurrent modules exhaust a 16 GB runner
          # BEFORE either trips its own ulimit, and the runner is killed --
          # "The runner has received a shutdown signal ... exit code 143",
          # which had this workflow red every night.  Capped so that jobs x cap
          # fits, the heavy module fails its own row with a bad_alloc and the
          # other 233 still report.
          - family: cvw
            mem_limit_kb: "7000000"
          - family: verilog-ethernet
          - family: verilog-pcie
          - family: hdmi
          - family: xiangshan
          # The complete Kunminghu core, one row per generated module (2002),
          # from the published generator output (release xiangshan-rtl-e4566c29)
          # -- see test/ext_ip/xiangshan-core-full.json.  Sharded 16 ways:
          # ~125 modules per runner, each a small Surelog closure (the 8
          # top-level blocks above the 16 MB cap are reported as skipped).
          - family: xiangshan-core-full
            shards: 16
            timeout: 330
    name: ext - ${{ matrix.family }}
    uses: ./.github/workflows/core-sweep.yml
    with:
      core: ${{ matrix.family }}
      cycles: "300"
      timeout: ${{ matrix.timeout || 300 }}
      shards: ${{ matrix.shards || 1 }}
      mem_limit_kb: ${{ matrix.mem_limit_kb || '12000000' }}
