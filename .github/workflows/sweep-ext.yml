name: Sweep external IP

# Per-module report for the external IP families under test/ext_ip/ (PULP
# common_cells / AXI, OpenHW CVE2 / CORE-V Wally, XiangShan's SystemVerilog
# arithmetic library, Alex Forencich's
# verilog-ethernet / verilog-pcie, hdl-util hdmi ...): every module of a
# family is read by read_uhdm and read_slang from a shallow clone at the
# manifest's pinned commit, SAT-mitered from reset, opt-checked and Verilator
# co-simulated against the RTL (test/ext_ip/ext_flow.py via core_sweep.py).
# Nightly + manual dispatch; one reusable sweep job per family.
#
# The XiangShan CORE families (xiangshan-core / xiangshan-core-full) are
# deliberately NOT in this matrix.  The core is Chisel, so they GENERATE their
# RTL first (mill + firtool) through the manifest's "generate" step, and that
# does not fit a hosted runner: ubuntu-24.04 gives 16 GB of RAM and 14 GB of
# free disk, while the cheaper MinimalConfig still peaks at 13.5 GB RSS to
# generate 1894 files / 2.2 M lines (DefaultConfig: 40 GB JVM heap, 3.2 M
# lines), and Surelog on XSTop wants ~36 GB.  Run them from a workstation with
# `make xiangshan-core` / `make xiangshan-core-full`.  The `xiangshan` family
# in the matrix is the hand-written XS-Verilog-Library and does run here.

on:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * *"   # nightly 03:47 UTC, clear of the pavona / caliptra sweeps

concurrency:
  group: sweep-ext-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        family: [common_cells, axi, cve2, cvw, verilog-ethernet, verilog-pcie, hdmi, xiangshan]
    name: ext - ${{ matrix.family }}
    uses: ./.github/workflows/core-sweep.yml
    with:
      core: ${{ matrix.family }}
      cycles: "300"
      timeout: 300
      shards: 1
