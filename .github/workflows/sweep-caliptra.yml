name: Sweep caliptra

# Per-instance report for chipsalliance/caliptra-rtl: every DIRECT instance of
# caliptra_top is SAT-mitered read_uhdm vs read_slang from reset.  Table lands
# in the run's step summary.  Nightly + manual dispatch, so the heavy chip
# elaboration doesn't run on every push (the sharded regression already gates
# correctness).
#
# Co-sim: every instance is Verilator co-simulated against its RTL
# (test/netlist_cosim.py) and the last shard co-simulates the whole chip
# through the caliptra_top_flat wrapper.

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: "Co-sim cycles (instances + full chip)"
        required: false
        default: "2000"
  schedule:
    - cron: "17 5 * * *"   # nightly 05:17 UTC, clear of the pavona sweep

concurrency:
  group: sweep-caliptra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep-caliptra:
    name: caliptra - caliptra_top (full chip)
    uses: ./.github/workflows/core-sweep.yml
    with:
      core: caliptra
      # 2000 cycles, matching the egret / dragonfly full-chip sweeps: at 300
      # the chip co-sim only reaches the tail of the boot sequence, so most of
      # the design never toggles and a divergence deeper than reset cannot be
      # observed.  The instance co-sims get the same budget.
      cycles: ${{ github.event.inputs.cycles || '2000' }}
      timeout: 350
      # 3 instance shards + 1 shard for the full-chip co-sim: the vault
      # miters are multi-million-variable proofs now and the chip co-sim is
      # three whole-chip Verilator builds — one 16 GB runner died mid-sweep.
      shards: 4
      # abr_inst / ecc_top1 peak at 10-11 GB RSS (minisat throws
      # OutOfMemoryException under a 12 GB address-space cap); sharded miters
      # run one at a time, so give them most of the runner.
      mem_limit_kb: "14500000"
