name: Sweep pavona

# Per-module pavona report: formal equivalence vs read_slang + Verilator co-sim
# (pass / divergence count) with a final co-sim pass-rate.  Table lands in the
# run's step summary.  Nightly + manual dispatch, so the heavy co-sims don’t
# run on every push (the sharded regression already gates correctness).

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: "Co-sim cycles per module"
        required: false
        default: "300"
  schedule:
    - cron: "47 3 * * *"   # nightly 03:47 UTC

concurrency:
  group: sweep-pavona-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    name: pavona - ibex
    uses: ./.github/workflows/core-sweep.yml
    with:
      core: pavona
      cycles: ${{ github.event.inputs.cycles || '300' }}
      timeout: 180

  # The Pavona TL-UL bus library (test/pavona_tlul_equiv): formal vs read_slang
  # + structural undriven check + multi-clock Verilator co-sim (adjudicates the
  # dual-clock CDC fifo the SAT miter cannot reach).  Runs under the same
  # workflow as the Ibex pavona sweep.
  sweep-tlul:
    name: pavona - tlul
    uses: ./.github/workflows/core-sweep.yml
    with:
      core: tlul
      cycles: ${{ github.event.inputs.cycles || '300' }}
      timeout: 180

  # The Pavona ACC (OTBN-family asymmetric-crypto bignum core) per-module
  # equivalence campaign (test/pavona_acc_equiv): formal vs read_slang +
  # structural undriven check.  Runs under the same workflow.
  sweep-acc:
    name: pavona - acc
    uses: ./.github/workflows/core-sweep.yml
    with:
      core: acc
      cycles: ${{ github.event.inputs.cycles || '300' }}
      timeout: 180

  # The Pavona KMAC (OpenTitan Keccak-MAC / SHA3 hashing core) per-module
  # equivalence campaign (test/pavona_kmac_equiv): formal vs read_slang +
  # structural undriven check + Verilator co-sim (adjudicates the SAT-hard
  # 1600-bit Keccak-f permutation the bounded miter times out on).  Runs under
  # the same workflow.
  sweep-kmac:
    name: pavona - kmac
    uses: ./.github/workflows/core-sweep.yml
    with:
      core: kmac
      cycles: ${{ github.event.inputs.cycles || '300' }}
      timeout: 180

  # The Pavona HMAC (OpenTitan HMAC-SHA2 core) per-module equivalence campaign
  # (test/pavona_hmac_equiv): same layout and checks as kmac (hmac, hmac_core,
  # hmac_reg_top + the prim_sha2_* / prim_packer primitives it instantiates,
  # incl. the MultimodeEn=1 wrappers).  prim_packer is SAT-hard (1500 s).
  sweep-hmac:
    name: pavona - hmac
    uses: ./.github/workflows/core-sweep.yml
    with:
      core: hmac
      cycles: ${{ github.event.inputs.cycles || '300' }}
      timeout: 180

  # EDN (entropy distribution network) and CSRNG (CTR-DRBG, with the AES
  # cipher core it instantiates vendored under rtl/aes): same layout/checks.
  sweep-edn:
    name: pavona - edn
    uses: ./.github/workflows/core-sweep.yml
    with:
      core: edn
      cycles: ${{ github.event.inputs.cycles || '300' }}
      timeout: 180

  sweep-csrng:
    name: pavona - csrng
    uses: ./.github/workflows/core-sweep.yml
    with:
      core: csrng
      cycles: ${{ github.event.inputs.cycles || '300' }}
      timeout: 180

  # AES (OpenTitan AES-128/192/256 accelerator, hw/ip/aes/rtl vendored whole;
  # default SecMasking=1 two-share DOM S-box): same layout/checks.
  sweep-aes:
    name: pavona - aes
    uses: ./.github/workflows/core-sweep.yml
    with:
      core: aes
      cycles: ${{ github.event.inputs.cycles || '300' }}
      timeout: 180

  # entropy_src (OpenTitan entropy source: health tests, conditioning, FIFOs;
  # hw/ip/entropy_src/rtl vendored whole): same layout/checks.
  sweep-entropy-src:
    name: pavona - entropy_src
    uses: ./.github/workflows/core-sweep.yml
    with:
      core: entropy_src
      cycles: ${{ github.event.inputs.cycles || '300' }}
      timeout: 180

  # keymgr (OpenTitan key manager: identity / key derivation through KMAC,
  # sideload keys; hw/ip/keymgr/rtl vendored whole): same layout/checks.
  sweep-keymgr:
    name: pavona - keymgr
    uses: ./.github/workflows/core-sweep.yml
    with:
      core: keymgr
      cycles: ${{ github.event.inputs.cycles || '300' }}
      timeout: 180

  # Small peripherals set (rom_ctrl, uart, aon_timer, rv_timer, pattgen,
  # sram_ctrl; hw/ip/<ip>/rtl vendored whole): same layout/checks.
  sweep-periph:
    name: pavona - periph
    uses: ./.github/workflows/core-sweep.yml
    with:
      core: periph
      cycles: ${{ github.event.inputs.cycles || '300' }}
      timeout: 180
