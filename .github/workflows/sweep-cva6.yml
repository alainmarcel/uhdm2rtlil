name: Sweep cva6

# Per-module cva6 report: formal equivalence vs read_slang + Verilator co-sim
# (pass / divergence count) with a final co-sim pass-rate.  Table lands in the
# run's step summary.  Nightly + manual dispatch, so the heavy co-sims don’t
# run on every push (the sharded regression already gates correctness).

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: "Co-sim cycles per module"
        required: false
        default: "300"
  schedule:
    - cron: "17 3 * * *"   # nightly 03:17 UTC

concurrency:
  group: sweep-cva6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    uses: ./.github/workflows/core-sweep.yml
    with:
      core: cva6
      cycles: ${{ github.event.inputs.cycles || '300' }}
      # Round-robin shard: the full cva6 sweep (SAT miters + per-module co-sim)
      # ran ~3h48m in one job and hit the timeout.
      #
      # Raised 6 -> 8 shards and 180 -> 240 min together with the double-shard
      # fix in core_sweep.py.  Until that fix each shard reported a DIFFERENT
      # slice than it ran, so most of its rows had no work dir and their
      # opt-check and co-sim silently no-op'd as "— (no run)" -- 85 of 95 rows
      # in the 2026-09-20 nightly.  Now every reported module is one the shard
      # actually elaborated, so each shard really runs ~18 miters and ~18
      # co-sims instead of ~2.  The extra budget is for the work that was being
      # skipped, not for new work.
      shards: 8
      timeout: 240
      # One miter / one co-sim at a time.  Shard 7 carries the two heaviest
      # Verilator builds of the whole matrix -- std_nbdcache (its read_uhdm
      # netlist maps 25 bit-enabled tc_sram memories to 376,857 one-bit flops:
      # 1.76 M lines of Verilog) and the full `cva6` core -- and with two
      # co-sims in flight they exceeded the 16 GB runner: the shard died with
      # "runner has received a shutdown signal" (exit 143) at ~48 min in both
      # 2026-09-28 runs on the Yosys 0.69 branch (the same netlists; the
      # allocator change made the reads ~35% slower, which shifted the two
      # builds into overlap).  Serial shards trade ~30 min for surviving.
      jobs: "1"

  # The OTHER configurations chipsalliance/sv-tests defines.  sv-tests builds
  # the full CVA6 core at FIVE flavours (its generators/ariane) and the two
  # jobs above cover ONE of them.  A flavour is not a different design: it is
  # the same RTL with a different `*_config_pkg.sv`, and every one of those
  # packages declares the same package name, so a flavour is one line of the
  # file list -- but it selects genuinely different RTL (the HPDcache subsystem
  # instead of the write-through cache, the hypervisor two-stage MMU, a 32-bit
  # datapath with no FPU), so reading one says nothing about the others.
  #
  # Cheap on purpose: the whole core is a SAT timeout even at the default
  # config, so this reads the core per flavour and gates on the STRUCTURAL
  # check -- every net the source assigns must have a driver.  Expectations and
  # their reasons live in test/cva6_equiv/cva6_configs.txt and ratchet.
  configs:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Same key the core sweeps package, so this normally restores their build
    # instead of repeating it.
    - name: Cache packaged runtime
      id: cache-runtime
      uses: actions/cache@v4
      with:
        path: |
          runtime.tar.gz
          verilator.tar.gz
        key: core-sweep-runtime-${{ github.sha }}

    - name: Install dependencies
      if: steps.cache-runtime.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build \
          google-perftools libgoogle-perftools-dev python3 python3-dev \
          python3-pip uuid-dev tclsh swig libreadline-dev flex bison \
          libfl-dev ccache default-jre

    - name: Setup ccache
      if: steps.cache-runtime.outputs.cache-hit != 'true'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: cva6-configs-${{ github.sha }}

    - name: Build project
      if: steps.cache-runtime.outputs.cache-hit != 'true'
      run: |
        pip3 install orderedmultidict
        rm -rf build/CMakeCache.txt build/CMakeFiles/
        make -j4 CC="ccache gcc" CXX="ccache g++" CPU_CORES=4

    - name: Unpack the cached runtime
      if: steps.cache-runtime.outputs.cache-hit == 'true'
      run: |
        tar xzf runtime.tar.gz
        test -x out/current/bin/yosys

    - name: Read CVA6 at every sv-tests configuration
      run: |
        cd test/cva6_equiv
        ./run_cva6_configs.sh | tee "$GITHUB_STEP_SUMMARY"

  # The full core the way the pavona / caliptra chips are swept: `cva6`
  # elaborated ONCE (read_uhdm + read_slang, hierarchy kept), every instance
  # at every level paired by path, one miter per distinct elaborated
  # parameterisation (every module with exactly the parameters it has under
  # the chip configuration -- the per-module sweep above cannot see an
  # instantiation's own overrides), plus a per-instance co-sim against the
  # RTL rebuilt with those parameters (test/cva6_chip/scripts/chip_flow.py).
  chip:
    uses: ./.github/workflows/core-sweep.yml
    with:
      core: cva6-chip
      cycles: ${{ github.event.inputs.cycles || '300' }}
      shards: 6
      timeout: 300
