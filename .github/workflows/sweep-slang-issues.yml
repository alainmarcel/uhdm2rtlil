# Sweep the MikePopoloski/slang issue corpus: every test/slang_issues/
# issue_<n>_*/dut.sv -- the SYNTHESIZABLE code block(s) of a slang issue (open
# or closed) that Surelog parses, harvested by test/slang_issues/harvest.py.
#
# slang is the SystemVerilog compiler under sv-elab / yosys's `read_slang`,
# the reference frontend of every other sweep, so each issue is a construct
# a real user asked of a SystemVerilog frontend.  Each row gets the usual
# columns: the read_uhdm-vs-read_slang formal miter (auto-generated over
# dut.sv), the undriven-net check, the read_slang co-sim and the read_uhdm
# co-sim -- "is slang issue #n supported by read_uhdm" is one row of one table.
name: Sweep slang-issues

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: "Co-sim cycles per test"
        required: false
        default: "300"
  schedule:
    - cron: "41 5 * * *"   # nightly 05:41 UTC, after sv-elab-issues' 05:11

concurrency:
  group: sweep-slang-issues-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    uses: ./.github/workflows/core-sweep.yml
    with:
      core: slang-issues
      cycles: ${{ github.event.inputs.cycles || '300' }}
      timeout: 120
      shards: 2
      jobs: "4"
